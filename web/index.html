<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Foody — pedidos y gestión para restaurantes">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Foody">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- Favicon / PWA -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Foody</title>
  <link rel="manifest" href="manifest.json">

  <!-- Errores visibles (diagnostico tunel / Brave) -->
  <script>
    (function () {
      function show(msg) {
        var d = document.createElement('pre');
        d.setAttribute('data-foody-error', '1');
        d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:40vh;overflow:auto;background:#1a1a1a;color:#ffe66d;padding:12px;z-index:99999;white-space:pre-wrap;font:12px/1.4 Consolas,monospace;border-radius:8px;';
        d.textContent = msg;
        document.body ? document.body.appendChild(d) : document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
      }
      window.addEventListener('error', function (e) { show('JS: ' + (e.message || e)); });
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + e.reason); });
    })();
  </script>
  
  <!-- Google Maps Places (checkout domicilio). loading=async = best practice Google. -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAWlN1nPfwbvaKk4epvcV0kAa1aPFssypg&libraries=places&loading=async"></script>
  <script>
    // Variables globales para comunicación con Dart
    window.placesSearchResult = null;
    window.placesSearchStatus = null;
    window.placesSearchCallbackId = 0;
    
    window.placeDetailsResult = null;
    window.placeDetailsStatus = null;
    window.placeDetailsCallbackId = 0;
    
    // Funciones helper para búsqueda de lugares
    window.searchPlaces = function(query) {
      window.placesSearchResult = null;
      window.placesSearchStatus = null;
      window.placesSearchCallbackId++;
      const currentId = window.placesSearchCallbackId;
      
      if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
        window.placesSearchStatus = 'API_NOT_LOADED';
        window.placesSearchResult = [];
        return currentId;
      }
      
      const service = new google.maps.places.AutocompleteService();
      const request = {
        input: query,
        componentRestrictions: { country: 'co' },
        language: 'es'
      };
      
      service.getPlacePredictions(request, function(predictions, status) {
        if (currentId === window.placesSearchCallbackId) {
          if (status === 'OK' && predictions) {
            window.placesSearchResult = predictions.map(function(p) {
              return {
                description: p.description,
                place_id: p.place_id
              };
            });
          } else {
            window.placesSearchResult = [];
          }
          window.placesSearchStatus = status;
        }
      });
      
      return currentId;
    };
    
    window.getPlaceDetails = function(placeId) {
      window.placeDetailsResult = null;
      window.placeDetailsStatus = null;
      window.placeDetailsCallbackId++;
      const currentId = window.placeDetailsCallbackId;
      
      if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
        window.placeDetailsStatus = 'API_NOT_LOADED';
        return currentId;
      }
      
      const service = new google.maps.places.PlacesService(document.createElement('div'));
      const request = {
        placeId: placeId,
        fields: ['geometry', 'formatted_address']
      };
      
      service.getDetails(request, function(place, status) {
        if (currentId === window.placeDetailsCallbackId) {
          if (status === 'OK' && place) {
            window.placeDetailsResult = {
              lat: place.geometry.location.lat(),
              lng: place.geometry.location.lng(),
              address: place.formatted_address || ''
            };
          } else {
            window.placeDetailsResult = null;
          }
          window.placeDetailsStatus = status;
        }
      });
      
      return currentId;
    };
    
    // Función para verificar si hay resultados disponibles
    window.checkPlacesSearch = function(callbackId) {
      if (window.placesSearchCallbackId === callbackId && window.placesSearchStatus !== null) {
        return {
          results: window.placesSearchResult,
          status: window.placesSearchStatus
        };
      }
      return null;
    };
    
    window.checkPlaceDetails = function(callbackId) {
      if (window.placeDetailsCallbackId === callbackId && window.placeDetailsStatus !== null) {
        return {
          result: window.placeDetailsResult,
          status: window.placeDetailsStatus
        };
      }
      return null;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
