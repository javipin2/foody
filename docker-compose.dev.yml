# Foody — entorno de desarrollo local (PostgreSQL para NestJS)
# Uso: docker compose -f docker-compose.dev.yml up -d
#
# Supabase self-hosted completo: ver docs/ENTORNO_LOCAL.md (repo oficial supabase/docker)

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foody_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: foody_password_dev
      POSTGRES_DB: foody_db
    ports:
      - '5432:5432'
    volumes:
      - foody_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d foody_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foody_postgres_data:
