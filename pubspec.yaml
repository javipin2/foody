name: reserva_canchas
description: Aplicación para reservar canchas sintéticas.
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # Internacionalización y localización
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter


  # Estado y arquitectura
  provider: ^6.0.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  
  # UI y widgets
  table_calendar: ^3.0.9
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.3.0
  animate_do: ^3.3.4
  
  # Networking y HTTP
  http: ^1.3.0

  # Supabase (datos: menú, pedidos, etc. — Firebase solo FCM en esta transición)
  supabase_flutter: ^2.8.4
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.5.0
  firebase_storage: ^12.4.5
  
  # Fonts y UI styling
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  device_info_plus: ^9.1.0
  
  # Charts y gráficas
  fl_chart: ^0.67.0
  
  # Archivos y documentos
  pdf: ^3.10.6
  barcode: ^2.2.8
  qr_flutter: ^4.1.0
  csv: ^5.1.1
  
  # Utilidades
  uuid: ^4.5.1
  crypto: ^3.0.5
  url_launcher: ^6.2.2
  share_plus: ^11.0.0
  app_links: ^6.4.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  logging: ^1.2.0  # Para manejo de logs en producción

  firebase_messaging: 15.2.9
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.1.0
  package_info_plus: ^4.2.0
  
  # ✅ NUEVA DEPENDENCIA REQUERIDA
  shared_preferences: ^2.2.2

  usb_thermal_printer_web_pro: ^0.1.2
  
  # Mapas y geolocalización (OpenStreetMap — sin costo por carga)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  audioplayers: ^6.6.0
  mobile_scanner: ^7.2.0
  video_player: ^2.11.1
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_foody.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_foody.png"
  web:
    generate: true
    image_path: "assets/logo_foody.png"
    background_color: "#FFFFFF"
    theme_color: "#FF6B35"
  windows:
    generate: true
    image_path: "assets/logo_foody.png"
    icon_size: 256

flutter:
  uses-material-design: true
  
  assets:
    - assets/foody.png
    - assets/logo_foody.png
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf
    - assets/Michel Teló - Ai Se Eu Te Pego (LetraLyrics).mp3

  # Optimizaciones para producción
  # Esto ayuda a reducir el tamaño de la app
  generate: true
